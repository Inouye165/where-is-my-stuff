<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Auto-Label Capture — WhereIsMyStuff</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #181c23;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #0ea5e9;
      --success: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f9;
        --card: #ffffff;
        --border: rgba(15, 23, 42, 0.12);
        --text: #0f172a;
        --muted: #64748b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.15rem;
    }
    .capture-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem 1.35rem;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    }
    .brand {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.28rem;
      line-height: 1.25;
    }
    .subtitle {
      margin: 0 0 1.2rem;
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .zone-banner {
      display: none;
      margin: 0 0 1rem;
      padding: 0.85rem;
      border-radius: 14px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.1);
      text-align: left;
    }
    .zone-banner.active {
      display: block;
    }
    .zone-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--danger);
      margin-bottom: 0.25rem;
    }
    .zone-sub {
      font-size: 0.84rem;
      color: var(--text);
      margin-bottom: 0.65rem;
    }
    .zone-minigrid {
      display: grid;
      gap: 3px;
      background: rgba(15, 23, 42, 0.35);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .zone-cell {
      aspect-ratio: 1.35 / 1;
      min-height: 12px;
      border-radius: 3px;
      background: rgba(148, 163, 184, 0.18);
      border: 1px solid rgba(148, 163, 184, 0.22);
    }
    .zone-cell.in-zone {
      background: rgba(239, 68, 68, 0.28);
      border-color: rgba(239, 68, 68, 0.7);
    }
    .zone-cell.is-target {
      background: rgba(239, 68, 68, 0.72);
      border-color: #ffffff;
    }
    .capture-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      width: 100%;
      padding: 1.75rem 1.2rem;
      border-radius: 16px;
      border: 2px dashed var(--accent);
      background: rgba(14, 165, 233, 0.1);
      color: var(--text);
      font-size: 1.02rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .capture-btn.disabled {
      opacity: 0.55;
      pointer-events: none;
    }
    .capture-icon {
      width: 44px;
      height: 44px;
      color: var(--accent);
    }
    .gallery-btn {
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .preview-wrap {
      display: none;
      margin-top: 1rem;
    }
    .preview-wrap img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      margin-top: 0.9rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
    }
    .status-pill.success {
      background: rgba(16, 185, 129, 0.16);
      color: var(--success);
    }
    .status-pill.info {
      background: rgba(14, 165, 233, 0.16);
      color: var(--accent);
    }
    .status-pill.error {
      background: rgba(239, 68, 68, 0.16);
      color: var(--danger);
    }
  </style>
</head>
<body>
  <main class="capture-card">
    <div class="brand">WhereIsMyStuff · Auto-Label</div>
    <h1 id="capture-title">Snap Container Labels</h1>
    <p id="capture-subtitle" class="subtitle">Take one clear, straight-on photo of the whole organizer face. Keep this tab open in case a close-up is needed.</p>

    <section id="zone-banner" class="zone-banner" aria-live="polite">
      <div id="zone-title" class="zone-title">Close-up requested</div>
      <div id="zone-sub" class="zone-sub"></div>
      <div id="zone-minigrid" class="zone-minigrid" aria-hidden="true"></div>
    </section>

    <label id="capture-trigger" for="mobile-camera-input" class="capture-btn">
      <svg class="capture-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      <span id="capture-btn-label">Tap to open camera</span>
      <input type="file" id="mobile-camera-input" accept="image/*" capture="environment" style="display: none;">
    </label>

    <label id="gallery-trigger" for="mobile-gallery-input" class="gallery-btn">
      <span>Choose from photo library</span>
      <input type="file" id="mobile-gallery-input" accept="image/*" style="display: none;">
    </label>

    <div id="preview-wrap" class="preview-wrap">
      <img id="preview-img" src="" alt="Captured organizer photo">
    </div>

    <div id="status-area"></div>
  </main>

  <script type="module" src="/js/label-capture-page.js"></script>
</body>
</html>
